<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Languesaki - Livre audio</title>

<style>
body {
    font-family: Arial, sans-serif;
    background:#fff8ef;
    text-align:center;
    padding:30px;
}

h1 {
    color:#e85d04;
}

.audio-item {
    background:white;
    margin:10px auto;
    padding:15px;
    max-width:600px;
    border-radius:10px;
}

a {
    text-decoration:none;
    color:#333;
}

button {
    padding:10px 20px;
    border-radius:8px;
    border:none;
    background:#ffb703;
    cursor:pointer;
}
</style>

</head>

<body>

<h1>🎧 Languesaki</h1>

<h2>Les leçons audio de Noiroux</h2>

<div id="liste">
Chargement des audios...
</div>


<script>

fetch("titres.json")
.then(response => response.json())
.then(audios => {

let html="";

audios.forEach(audio => {

html += `
<div class="audio-item">

<h3>${audio.titre}</h3>

<a href="${audio.url}">
<button>
▶ Écouter
</button>
</a>

</div>
`;

});

document.getElementById("liste").innerHTML = html;

})

.catch(error => {

document.getElementById("liste").innerHTML =
"Erreur de chargement des audios";

});

</script>

</body>

</html>
