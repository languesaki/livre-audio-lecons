<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Générateur QR Languesaki Volume 2</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
body{
font-family:Arial,sans-serif;
background:#f8f1e5;
text-align:center;
padding:30px;
}

button{
background:#f28c28;
color:white;
border:none;
padding:12px 25px;
margin:10px;
border-radius:10px;
font-size:16px;
cursor:pointer;
}

#qrs{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:20px;
margin-top:30px;
}

.qr{
width:190px;
padding:15px;
border-radius:18px;
background:linear-gradient(180deg,#4FA3FF,#F28C28);
color:white;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.qr p{
font-size:18px;
font-weight:bold;
}

.qrcode{
background:white;
padding:10px;
width:120px;
height:120px;
margin:auto;
border-radius:12px;
}

.scan{
margin-top:12px;
font-weight:bold;
}
</style>

</head>

<body>

<h1>🦊 Générateur QR Languesaki Volume 2</h1>

<p>Créez automatiquement les QR codes des fichiers audio.</p>

<button onclick="creerQR()">Créer les QR</button>
<button onclick="telechargerZIP()">Télécharger tous les QR</button>

<div id="qrs"></div>


<script>

let listeQR=[];


async function creerQR(){

document.getElementById("qrs").innerHTML="";
listeQR=[];


const reponse = await fetch("titres-volume-2.json");
const donnees = await reponse.json();

console.log("Nombre d'audios chargés :", donnees.length);


donnees.forEach(item=>{


let bloc=document.createElement("div");
bloc.className="qr";


let titre=document.createElement("p");


let texte=item.titre.replace(/^Volume \d+ - \d+ - /,"");



if(texte.startsWith("Son ")){

let son=texte.replace("Son ","").trim();


let sons={

"T":"[t]",
"CH":"[ʃ]",
"N":"[n]",
"B":"[b]",
"D":"[d]",
"H":"[']",
"P":"[p]",
"K":"[k]",

"O nasal ON OM":"[ɔ̃]",

"E Fermé ER EZ":"[e]",

"E Ouvert ET":"[ɛ]",

"E Ouvert EL EC ES ER":"[ɛ]"

};


texte="Écoute le son "+(sons[son] || son);


}



else if(texte.includes("Activité") || texte.includes("Activite")){


let son=texte
.replace("Activité Entendre Son ","")
.replace("Activite Entendre Son ","")
.replace("Activite_Entendre_Son_","")
.replace("Activite_Entendre_Son ","")
.trim();


let sonsActivite={

"A":"[a]",
"I":"[i]",
"O":"[o]",
"U":"[y]",
"OU":"[u]",

"E muet":"[ə]",
"E fermé":"[e]",
"E ouvert":"[ɛ]",

"O_Nasal":"[ɔ̃]",
"O_Nasal_ON_OM":"[ɔ̃]",
"O nasal":"[ɔ̃]",

"K":"[k]",
"S":"[s]"

};


texte="✏️ Entendre le son "+(sonsActivite[son] || son);


}



else if(texte.includes("Syllabes")){

texte="Lis les syllabes";

}



else if(texte.includes("Boîte") || texte.includes("Boite")){


let outil=texte
.replace("Boîte Outils ","")
.replace("Boîte à outils ","")
.replace("Boite_Outils_","")
.replace(/_/g," ")
.trim();


texte="Boîte à outils :<br>"+outil;


}



titre.innerHTML=texte;


let qrDiv=document.createElement("div");
qrDiv.className="qrcode";


new QRCode(qrDiv,{
text:item.url,
width:120,
height:120
});


let scan=document.createElement("div");
scan.className="scan";
scan.innerHTML="Scanne-moi !";


bloc.appendChild(titre);
bloc.appendChild(qrDiv);
bloc.appendChild(scan);


listeQR.push({
titre:item.titre,
element:bloc
});


document.getElementById("qrs").appendChild(bloc);


});


}



async function telechargerZIP(){

if(listeQR.length===0){
alert("Créez d'abord les QR codes.");
return;
}


let zip=new JSZip();


for(let qr of listeQR){

let canvas=await html2canvas(qr.element);

let image=canvas.toDataURL("image/png")
.split(",")[1];


zip.file(
qr.titre.replace(/[^a-z0-9]/gi,"_")+".png",
image,
{base64:true}
);


}


let contenu=await zip.generateAsync({
type:"blob"
});


saveAs(contenu,"QR_Languesaki_Volume_2.zip");


}

</script>

</body>
</html>
