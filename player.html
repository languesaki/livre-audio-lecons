<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Languesaki - Audio</title>


<style>

body {

    font-family: Arial, sans-serif;
    text-align: center;
    background: #fff8ef;
    margin: 0;
    padding: 20px;

}


.container {

    max-width: 500px;
    margin: auto;
    background: white;
    border-radius: 30px;
    padding: 25px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.15);

}


/* Logo sur le côté */

.logo {

    width: 110px;
    display: block;
    margin-left: 20px;
    margin-bottom: 5px;

}


/* Noiroux grand */

.noiroux {

    width: 330px;
    max-width: 95%;
    margin: 5px auto 15px;
    display: block;

}


/* Message */

.intro {

    font-size: 20px;
    color: #555;
    line-height: 1.5;
    margin-bottom: 20px;

}


/* Titre */

.audio-title {

    font-size: 26px;
    color: #333;
    margin: 20px 0;

}



/* Bloc audio */

.audio-box {

    background: #ffb000;

    border-radius: 30px;

    padding: 20px;

    margin-top: 20px;

}



/* Bouton */

button {

    background: white;

    border: none;

    border-radius: 30px;

    padding: 15px 25px;

    font-size: 20px;

    font-weight: bold;

    cursor: pointer;

}



button:hover {

    opacity: 0.85;

}


/* Barre */

input[type="range"] {

    width: 100%;

    margin-top: 20px;

    cursor: pointer;

}



/* Temps */

.time {

    display: flex;

    justify-content: space-between;

    color: white;

    font-size: 14px;

}



/* Bravo */

.bravo {

    font-size: 22px;

    margin-top: 25px;

    color: #333;

}


</style>


</head>



<body>


<div class="container">


<img class="logo" src="assets/Logo.png">


<img class="noiroux" src="assets/noiroux.png">



<p class="intro">

Écoute bien et amuse-toi avec moi ! 🎵

</p>




<h2 class="audio-title" id="audioTitle">

🎵 Audio

</h2>




<div class="audio-box">


<audio id="audioPlayer">

<source id="audioSource" type="audio/mpeg">

</audio>



<button id="playButton" onclick="playAudio()">

▶ Écouter avec Noiroux

</button>



<input type="range" id="progressBar" value="0" min="0" max="100">



<div class="time">

<span id="currentTime">0:00</span>

<span id="duration">0:00</span>

</div>


</div>




<p class="bravo">

Bravo ! 🌟

</p>



</div>




<script>


const params = new URLSearchParams(window.location.search);


const audio = params.get("audio");

const title = params.get("title");



const player = document.getElementById("audioPlayer");

const source = document.getElementById("audioSource");

const button = document.getElementById("playButton");

const progressBar = document.getElementById("progressBar");

const currentTime = document.getElementById("currentTime");

const duration = document.getElementById("duration");



if(audio){

    source.src = audio;

    player.load();

}



if(title){

    document.getElementById("audioTitle").innerHTML = "🎵 " + title;

}




function playAudio(){


    if(player.paused){

        player.play();

        button.innerHTML = "⏸ Pause";

    }

    else{

        player.pause();

        button.innerHTML = "▶ Écouter avec Noiroux";

    }

}




player.addEventListener("loadedmetadata", function(){

    progressBar.max = player.duration;

    duration.innerHTML = formatTime(player.duration);

});





player.addEventListener("timeupdate", function(){

    progressBar.value = player.currentTime;

    currentTime.innerHTML = formatTime(player.currentTime);

});





progressBar.addEventListener("input", function(){

    player.currentTime = progressBar.value;

});





player.addEventListener("ended", function(){

    button.innerHTML = "▶ Écouter avec Noiroux";

});





function formatTime(seconds){

    if(isNaN(seconds)){

        return "0:00";

    }


    let minutes = Math.floor(seconds / 60);

    let secs = Math.floor(seconds % 60);


    if(secs < 10){

        secs = "0" + secs;

    }


    return minutes + ":" + secs;

}



</script>


</body>

</html>
