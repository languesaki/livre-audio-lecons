```html
<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Languesaki - Audio</title>

<style>

body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #fff8ef;
    margin: 0;
    padding: 20px;
}


.container {

    max-width: 500px;
    margin: auto;
    background: white;
    border-radius: 30px;
    padding: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);

}


/* Logo */

.logo {

    width: 110px;
    margin-bottom: 15px;

}


/* Noiroux */

.noiroux {

    width: 280px;
    max-width: 90%;
    margin: 10px auto 20px;

}


/* Message */

.intro {

    font-size: 20px;
    color: #555;
    line-height: 1.5;
    margin-bottom: 20px;

}


/* Titre audio */

.audio-title {

    font-size: 26px;
    color: #333;
    margin: 20px 0;

}


/* Lecteur audio */

audio {

    width: 100%;
    margin: 15px 0;

}


/* Boutons */

button {

    background: #ffb000;
    border: none;
    border-radius: 30px;
    padding: 12px 20px;
    font-size: 18px;
    cursor: pointer;
    margin: 8px;

}


button:hover {

    opacity: 0.85;

}


/* Bravo */

.bravo {

    font-size: 22px;
    margin-top: 25px;
    color: #333;

}


</style>

</head>


<body>


<div class="container">


<img class="logo" src="assets/Logo.png">


<img class="noiroux" src="assets/noiroux.png">


<p class="intro">

Écoute bien et amuse-toi avec moi ! 🎵

</p>



<h2 class="audio-title" id="audioTitle">

🎵 Audio

</h2>



<audio id="audioPlayer">

<source id="audioSource" type="audio/mpeg">

</audio>



<button id="playButton" onclick="playAudio()">

▶ Écouter avec Noiroux

</button>


<br>


<button onclick="rewindAudio()">

⏪ -10 secondes

</button>


<button onclick="forwardAudio()">

⏩ +10 secondes

</button>


<button onclick="restartAudio()">

🔄 Recommencer

</button>



<p class="bravo">

Bravo ! 🌟

</p>


</div>




<script>


const params = new URLSearchParams(window.location.search);


const audio = params.get("audio");

const title = params.get("title");


const player = document.getElementById("audioPlayer");

const button = document.getElementById("playButton");

const source = document.getElementById("audioSource");



if(audio){

    source.src = audio;

    player.load();

}



if(title){

    document.getElementById("audioTitle").innerHTML = "🎵 " + title;

}




function playAudio(){


    if(player.paused){

        player.play();

        button.innerHTML = "⏸ Pause";

    }

    else{

        player.pause();

        button.innerHTML = "▶ Écouter avec Noiroux";

    }


}



function rewindAudio(){

    player.currentTime = Math.max(0, player.currentTime - 10);

}



function forwardAudio(){

    player.currentTime = Math.min(player.duration, player.currentTime + 10);

}



function restartAudio(){

    player.currentTime = 0;

    player.play();

    button.innerHTML = "⏸ Pause";

}



</script>


</body>

</html>
```
