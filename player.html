<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Languesaki - Audio</title>


<style>

* {
    box-sizing: border-box;
}


body {

    font-family: Arial, sans-serif;

    text-align: center;

    background: #fff8ef;

    margin: 0;

    padding: 20px;

}


/* Carte Premium */

.container {

    max-width: 520px;

    margin: auto;

    background: #ffffff;

    border: 8px solid #e8d2ad;

    border-radius: 38px;

    padding: 25px;

    box-shadow:
    0 8px 25px rgba(160,120,70,0.25);

    animation: apparition 0.8s ease;

}



@keyframes apparition {

    from {

        opacity:0;

        transform:translateY(20px);

    }

    to {

        opacity:1;

        transform:translateY(0);

    }

}



/* Logo */

.logo {

    width:120px;

    display:block;

    margin-left:15px;

    margin-bottom:5px;

}



/* Noiroux */

.noiroux {

    width:340px;

    max-width:95%;

    display:block;

    margin:0 auto 10px;

}



/* Message */

.intro {

    font-size:21px;

    color:#555;

    line-height:1.5;

    margin-bottom:20px;

}



/* Titre */

.audio-title {

    font-size:27px;

    color:#333;

    margin:15px 0 20px;

}



/* Bloc audio */

.audio-box {


    background:linear-gradient(

        135deg,

        #ffc44d,

        #ffae00

    );


    border-radius:32px;

    padding:22px;


    box-shadow:

    0 6px 15px rgba(200,140,0,0.25);

}



/* Bouton */

button {


    background:white;

    border:none;

    border-radius:35px;

    padding:16px 28px;

    font-size:20px;

    font-weight:bold;

    cursor:pointer;


    box-shadow:

    0 4px 8px rgba(0,0,0,0.15);


    transition:0.2s;

}



button:hover {

    transform:scale(1.04);

}



/* Barre */

input[type="range"] {

    width:100%;

    margin-top:22px;

    cursor:pointer;

}



/* Temps */

.time {

    display:flex;

    justify-content:space-between;

    color:white;

    font-size:15px;

    margin-top:8px;

}



/* Bravo image */

.bravo {

    width:180px;

    max-width:70%;

    margin:25px auto 5px;

    display:block;

}



.bravo-animation {


    animation:rebond 0.8s ease;


}



@keyframes rebond {


    0% {

        transform:scale(1);

    }


    40% {

        transform:scale(1.15);

    }


    70% {

        transform:scale(0.95);

    }


    100% {

        transform:scale(1);

    }


}



</style>


</head>



<body>



<div class="container">



<img class="logo" src="assets/Logo.png">



<img class="noiroux" src="assets/noiroux.png">



<p class="intro">

Écoute bien et amuse-toi avec moi ! 🎵

</p>



<h2 class="audio-title" id="audioTitle">

🎵 Audio

</h2>




<div class="audio-box">


<audio id="audioPlayer">

<source id="audioSource" type="audio/mpeg">

</audio>



<button id="playButton" onclick="playAudio()">

▶ Écouter avec Noiroux

</button>



<input 

type="range"

id="progressBar"

value="0"

min="0"

max="100">



<div class="time">

<span id="currentTime">0:00</span>

<span id="duration">0:00</span>

</div>


</div>




<img 

class="bravo" 

id="bravoImage"

src="assets/bravo_mains.png">



</div>




<script>



const params = new URLSearchParams(window.location.search);



const audio = params.get("audio");

const title = params.get("title");



const player = document.getElementById("audioPlayer");

const source = document.getElementById("audioSource");

const button = document.getElementById("playButton");

const progressBar = document.getElementById("progressBar");

const currentTime = document.getElementById("currentTime");

const duration = document.getElementById("duration");

const bravoImage = document.getElementById("bravoImage");




/* Chargement audio QR code */


if(audio){

    source.src = audio;

    player.load();

}





/* Titre venant du QR */


if(title){

    document.getElementById("audioTitle").innerHTML = "🎵 " + title;

}





/* Bouton lecture */


function playAudio(){


    if(player.paused){


        player.play();


        button.innerHTML="⏸ Pause";


    }


    else{


        player.pause();


        button.innerHTML="▶ Écouter avec Noiroux";


    }


}





/* Durée */


player.addEventListener("loadedmetadata",function(){


    progressBar.max = player.duration;


    duration.innerHTML=formatTime(player.duration);


});







/* Progression */


player.addEventListener("timeupdate",function(){


    progressBar.value=player.currentTime;


    currentTime.innerHTML=formatTime(player.currentTime);


});







/* Déplacement barre */


progressBar.addEventListener("input",function(){


    player.currentTime=progressBar.value;


});







/* Fin audio */


player.addEventListener("ended",function(){


    button.innerHTML="▶ Écouter avec Noiroux";


    bravoImage.classList.remove("bravo-animation");


    void bravoImage.offsetWidth;


    bravoImage.classList.add("bravo-animation");


});







function formatTime(seconds){


    if(isNaN(seconds)){

        return "0:00";

    }



    let minutes=Math.floor(seconds/60);


    let secs=Math.floor(seconds%60);



    if(secs<10){

        secs="0"+secs;

    }



    return minutes+":"+secs;


}



</script>



</body>

</html>
