<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Générateur QR Languesaki</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    background:#f8f1e5;
    text-align:center;
    padding:30px;
}

h1 {
    color:#333;
}

button {
    background:#f28c28;
    color:white;
    border:none;
    padding:12px 25px;
    margin:10px;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

button:hover {
    opacity:0.8;
}

#qrs {
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    margin-top:30px;
}

.qr {
    width:190px;
    padding:15px;
    border-radius:18px;
    background:linear-gradient(180deg,#4FA3FF,#F28C28);
    color:white;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.qr p {
    margin:0 0 12px;
    font-size:18px;
    font-weight:bold;
}

.qrcode {
    width:120px;
    height:120px;
    margin:auto;
    background:white;
    padding:10px;
    border-radius:12px;
}

.scan {
    margin-top:12px;
    font-size:16px;
    font-weight:bold;
}
</style>

</head>

<body>

<h1>🦊 Générateur QR Languesaki</h1>

<p>
Créez automatiquement les QR codes des fichiers audio.
</p>

<button onclick="creerQR()">Créer les QR</button>

<button onclick="telechargerZIP()">Télécharger tous les QR</button>


<div id="qrs"></div>


<script>

let listeQR = [];


async function creerQR(){

    document.getElementById("qrs").innerHTML="";
    listeQR=[];


    const reponse = await fetch("titres.json");
    const donnees = await reponse.json();


    donnees.forEach((item,index)=>{


        let bloc=document.createElement("div");
        bloc.className="qr";


        let titre=document.createElement("p");

let texte=item.titre;

// Supprime "Volume 1 - 001 - "
texte = texte.replace(/^Volume \d+ - \d+ - /,"");
if(texte=="Alphabet"){
    texte="Alphabet";
}
// Sons
if(texte.startsWith("Son ")){
    let son = texte.replace("Son ","");

    let phon={
        "A":"a",
        "I":"i",
        "U":"y",
        "O":"o",
        "OU":"u",
        "L":"l",
        "M":"m",
        "R":"ʁ",
        "V":"v",
        "Z":"z",
        "S (1)":"s",
        "S (2)":"z",
        "E ouvert / E grave / E circonflexe":"ɛ"
    };

    if(phon[son]){
        texte="Écoute le son ["+phon[son]+"]";
    } else {
        texte="Écoute le son "+son;
    }
}

// Comptine
else if(texte.includes("Comptine")){
    texte="Écoute la comptine 🎵";
}

// Activité
else if(texte.includes("Activité")){
    texte="Activité 🎯";
}

// Boîte à outils
else if(texte.includes("Boîte")){
    texte="Boîte à outils 🧰";
}

// Syllabes
else if(texte.includes("Syllabes")){
    texte="Lis les syllabes";
}

titre.innerHTML=texte;


        let qrDiv=document.createElement("div");
qrDiv.className="qrcode";


        new QRCode(qrDiv,{
    text:item.url,
    width:120,
    height:120
});


    bloc.appendChild(titre);
bloc.appendChild(qrDiv);


let scan=document.createElement("div");
scan.className="scan";
scan.innerHTML="Scanne-moi !";

bloc.appendChild(scan);


document.getElementById("qrs")
.appendChild(bloc);


    });


}


async function telechargerZIP(){

    if(listeQR.length===0){
        alert("Créez d'abord les QR codes.");
        return;
    }


    let zip=new JSZip();


    for(let qr of listeQR){

        let canvas=qr.element.querySelector("canvas");

        let image=canvas.toDataURL("image/png")
        .split(",")[1];


        zip.file(
            qr.titre.replace(/[^a-z0-9]/gi,"_")+".png",
            image,
            {base64:true}
        );

    }


    let contenu=await zip.generateAsync({
        type:"blob"
    });


    saveAs(contenu,"QR_Languesaki.zip");

}

</script>


</body>
</html>
